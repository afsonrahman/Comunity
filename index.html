<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .login-box {
            width: 350px;
            padding: 35px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }

        .login-box p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .input-box {
            margin-bottom: 18px;
        }

        .input-box label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-weight: bold;
        }

        .input-box input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        .input-box input:focus {
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #5568d9;
        }

        .bottom-text {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Welcome</h1>
        <p>Login to your account</p>

        <form>

            <div class="input-box">
                <label for="name">Name</label>
                <input 
                    type="text" 
                    id="name" 
                    placeholder="Write Your Name"
                    required
                >
            </div>

            <div class="input-box">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Write Your Password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="bottom-text">
            © 2026 Community
        </div>

    </div>

</body>
</html>
